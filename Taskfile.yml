version: '3'

tasks:
  fix:
    desc: Lint, format and type-check (mutating)
    cmds:
      - |
        uv run -- ruff check --fix && \
        uv run -- ruff format && \
        uv run -- ty check

  test:
    desc: Run the test suite
    cmds:
      - uv run -- pytest

  check:
    desc: Lint, format check, type-check and test (non-mutating)
    cmds:
      - |
        uv run -- ruff check && \
        uv run -- ruff format --check && \
        uv run -- ty check && \
        uv run -- pytest

  release:
    desc: "Tag a release after running all gates (task release -- 0.6.0 [--push|--dry-run])"
    cmds:
      - scripts/release.sh {{.CLI_ARGS}}
