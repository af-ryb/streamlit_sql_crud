version: '3'

tasks:
  deploy-docs:
    desc: Deploy mkdocs to github
    cmds:
      - uv run mkdocs gh-deploy

  show-docs:
    desc: Serve local mkdocs
    cmds:
      - uv run mkdocs serve

  fix:
    desc: Lint, format and type-check (mutating)
    cmds:
      - |
        uv run -- ruff check --fix && \
        uv run -- ruff format && \
        uv run -- ty check

  test:
    desc: Run the test suite
    cmds:
      - uv run -- pytest

  check:
    desc: Lint, format check, type-check and test (non-mutating)
    cmds:
      - |
        uv run -- ruff check && \
        uv run -- ruff format --check && \
        uv run -- ty check && \
        uv run -- pytest
