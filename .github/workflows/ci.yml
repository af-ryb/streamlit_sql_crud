name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run -- ruff check
      - name: Ruff format
        run: uv run -- ruff format --check
      - name: Type check
        run: uv run -- ty check
      - name: Tests
        run: uv run -- pytest
      - name: Tests on SQLAlchemy 2.1
        run: uv run --with 'sqlalchemy>=2.1,<2.2' -- pytest -p no:cacheprovider
