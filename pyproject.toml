[tool.ty.src]
include = ["streamlit_pydantic_crud", "tests"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["streamlit_pydantic_crud"]

[tool.vulture]
exclude = []
ignore_decorators = []
ignore_names = []
make_whitelist = false
min_confidence = 0
paths = ["streamlit_pydantic_crud"]
sort_by_size = true
verbose = false

[tool.ruff]
exclude = [".venv", ".claude", "whitelist.py", "alembic", "alembic_dev"]
line-length = 88

[tool.ruff.lint]
ignore = ["SIM108", "E501", "RET504", "PLR", "PTH123", "ISC001","ARG001","ARG002", "C901"]
select = ["UP","YTT", "A", "EM", "ICN","I", "SIM", "E", "F", "C90", "B", "C4", "FA", "ISC", "INP", "PIE", "RET", "TID", "ARG", "PTH", "ERA", "PD", "PL", "FLY", "NPY", "PERF", "FURB", "RUF", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["_self"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*ScriptRunContext.*:UserWarning",
]


[project]
name = "streamlit_pydantic_crud"
version = "0.6.2"
description = "Enhanced CRUD interface for SQLAlchemy using Streamlit with Pydantic validation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT License"}
dependencies = [
    "python-dateutil",
    "pandas",
    "sqlalchemy",
    "streamlit>=1.52.0",
    "streamlit_datalist",
    "streamlit_antd_components",
    "loguru>=0.7.3",
    "pydantic>=2.0.0",
]

[dependency-groups]

dev = [
    "setuptools",
    "ipython",
    "build",
    "rich",
    "pandas-stubs",
    "vulture",
    "pdbpp",
    "ruff",
    "pytest>=9.1.1",
    "ty>=0.0.88",
]

[project.urls]
homepage = "https://github.com/af-ryb/streamlit_sql_crud"
repository = "https://github.com/af-ryb/streamlit_sql_crud"
original = "https://github.com/edkedk99/streamlit_sql"
